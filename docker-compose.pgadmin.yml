# Local pgAdmin overlay.
#
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml \
#     -f docker-compose.pgadmin.yml up -d pgadmin
#
# Open http://localhost:5050 and log in with:
#   admin@example.com / fyralis

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: company_os_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: fyralis
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./.pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgadmin-data:
