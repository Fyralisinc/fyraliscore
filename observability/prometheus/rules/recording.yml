# Recording rules — precompute the dashboard-hot expressions.
# Naming: level:metric:operation per Prometheus convention, prefixed
# fyralis. The legacy ingestion counters carry no _total suffix; rate()
# works on them regardless.

groups:
  - name: fyralis-recording
    interval: 30s
    rules:
      # Per-worker heartbeat age (new lib families OR legacy ingestion one).
      - record: fyralis:worker_heartbeat_age_seconds
        expr: >
          max by (worker) (
            ingestion_heartbeat_age_seconds
            or worker_heartbeat_age_seconds
          )

      # Embedding failure ratio over 10m (alert input).
      - record: fyralis:embed_failure_ratio:10m
        expr: >
          sum(rate(ingestion_embedding_worker_embeds_failed[10m]))
          /
          clamp_min(
            sum(rate(ingestion_embedding_worker_embeds_succeeded[10m]))
            + sum(rate(ingestion_embedding_worker_embeds_failed[10m])),
            1e-9
          )

      # Gateway 5xx rate by route over 5m.
      - record: fyralis:gateway_5xx_rate:5m
        expr: >
          sum by (route) (rate(http_requests_total{status=~"5.."}[5m]))

      # Product workflow aggregate request rate over 5m. This intentionally
      # excludes webhooks, debug, internal, health, and ingestion routes.
      - record: fyralis:product_workflow_request_rate:5m
        expr: >
          sum(rate(product_workflow_requests_total[5m]))

      # Product workflow 5xx ratio over 5m. Budget target: <=1% 5xx.
      - record: fyralis:product_workflow_error_ratio:5m
        expr: >
          sum(rate(product_workflow_requests_total{status_class="5xx"}[5m]))
          /
          clamp_min(
            sum(rate(product_workflow_requests_total[5m])),
            1e-9
          )

      # Product workflow p95 latency over 5m. Budget target: <=2s p95.
      - record: fyralis:product_workflow_latency_p95_seconds:5m
        expr: >
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(product_workflow_request_duration_seconds_bucket[5m])
            )
          )

      # Short-window product SLO burn inputs. These are first-pass launch
      # targets and are explicitly tuned after staging soak.
      - record: fyralis:product_workflow_error_budget_burn:5m
        expr: fyralis:product_workflow_error_ratio:5m / 0.01

      - record: fyralis:product_workflow_latency_budget_burn:5m
        expr: fyralis:product_workflow_latency_p95_seconds:5m / 2

      # Webhook verification failure rate by provider over 5m.
      - record: fyralis:webhook_failure_rate:5m
        expr: >
          sum by (provider) (rate(webhook_verification_failures_total[5m]))

      # LLM spend per hour (USD), from the think worker's cost counter.
      - record: fyralis:llm_spend_usd_per_hour
        expr: sum(rate(think_llm_cost_usd_total[1h])) * 3600

      # DB pool saturation per process pool.
      - record: fyralis:db_pool_saturation
        expr: db_pool_in_use / clamp_min(db_pool_max, 1)

      # Worst consumer-group lag (kafka-exporter).
      - record: fyralis:kafka_worst_group_lag
        expr: max by (consumergroup) (kafka_consumergroup_lag_sum)

  - name: fyralis-perception-pipeline
    interval: 30s
    rules:
      - alert: PerceptionPipelineDeadLetteredWork
        expr: >
          max({__name__=~"(identity_resolution|perception_knowledge|episode_constructor|episode_handoff)_queue_dead_letter"}) > 0
        for: 5m
        labels:
          severity: critical
          owner: perception
        annotations:
          summary: Durable perception pipeline work is dead-lettered
          runbook: docs/operations/perception-pipeline-runbook.md

      - alert: PerceptionPipelineWorkerDown
        expr: >
          up{job="fyralis-workers",worker=~"identity_resolution_worker|perception_knowledge_worker|episode_constructor_worker|episode_settlement_worker|episode_handoff_worker"} == 0
        for: 5m
        labels:
          severity: critical
          owner: perception
        annotations:
          summary: A required perception pipeline worker is unavailable
          runbook: docs/operations/perception-pipeline-runbook.md

  - name: fyralis-source-connectors
    interval: 30s
    rules:
      - record: fyralis:source_connector_quarantined
        expr: max(ingestion_source_connector_lifecycle_quarantined)

      - record: fyralis:source_connector_control_failure_ratio:10m
        expr: >
          sum(rate(ingestion_source_connector_lifecycle_control_failures[10m]))
          /
          clamp_min(
            sum(rate(ingestion_source_connector_lifecycle_control_refreshes[10m])),
            1e-9
          )

      - alert: SourceConnectorArtifactQuarantined
        expr: fyralis:source_connector_quarantined > 0
        for: 5m
        labels:
          severity: critical
          owner: ingestion
        annotations:
          summary: A source connector artifact is quarantined
          runbook: docs/ingestion/source-connectors/operations-runbook.md

      - alert: SourceConnectorControlPlaneDegraded
        expr: fyralis:source_connector_control_failure_ratio:10m > 0.01
        for: 10m
        labels:
          severity: warning
          owner: ingestion
        annotations:
          summary: Source connector control-plane refreshes exceed the error budget
          runbook: docs/ingestion/source-connectors/operations-runbook.md
