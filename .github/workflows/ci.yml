name: CI

on:
  pull_request:
  push:
    # `production` is included so the deploy workflow can gate itself on
    # a green CI run via `workflow_run` (see deploy-production.yml).
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.6.9

      # Conservative ruleset: catches syntax/runtime bugs, unused imports,
      # and accidental fixture/import redefinitions without enforcing broad
      # style churn across the repo.
      - name: Ruff check
        run: ruff check --select E9,F63,F7,F82,F821,F811,F401 .

  architecture:
    name: Architecture (static contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # import-linter builds a static import graph (grimp) — it parses the
      # source tree and only needs `lib`/`services` importable from the repo
      # root, so the heavy runtime deps are not required here.
      - name: Install import-linter
        run: pip install "import-linter>=2.0"

      # Enforces the layer-boundary contracts declared in pyproject.toml
      # ([tool.importlinter]). Green today; a failure means a new import
      # crossed a layer boundary it should not.
      - name: Check layer boundaries
        run: lint-imports

      # Enforces small ratchets that complement import-linter: queue-owner
      # raw-write bans plus import-linter allowlist growth ceilings.
      - name: Check architecture ratchets
        run: python scripts/check_architecture_ratchets.py

      # Keeps the checked-in main-branch required status-check policy aligned
      # with the workflow job names GitHub exposes for branch protection.
      - name: Check required merge checks policy
        run: python scripts/check_github_required_checks.py

      # Verifies the production-mounted gateway route inventory remains behind
      # the expected auth boundary and substrate routes keep row-level access.
      - name: Check production route access
        run: python scripts/audit_gateway_route_access.py --production --check > /tmp/gateway-route-access.md

      # Ensures every bounded product workflow has explicit p95/p99 query
      # budgets plus hot-path/index-review evidence before soak testing.
      - name: Check product query performance budgets
        run: python scripts/check_product_query_budgets.py

      # Ensures tenant-scoped and expensive-worker concurrency controls remain
      # explicit in the production environment contract.
      - name: Check concurrency controls
        run: python scripts/check_concurrency_controls.py

      # Ensures every canonical ingestion source has a status/pause/resume/
      # uninstall/rotation operator path through generic or dedicated tooling.
      - name: Check source lifecycle contract
        run: python scripts/check_source_lifecycle_contract.py

      # Blocks product-facing HTTP routes from returning raw exception text or
      # free-form implementation details instead of bounded error codes.
      - name: Check product error contract
        run: python scripts/check_product_error_contract.py

      # Blocks gateway HTTP routes from returning raw exception text at
      # JSONResponse/HTTPException response boundaries.
      - name: Check gateway error contract
        run: python scripts/check_gateway_error_contract.py

      # Keeps `.env.production.example` aligned with fail-closed production
      # settings so deploy operators see required keys before runtime startup.
      - name: Check production env contract
        run: python scripts/check_production_env_contract.py

      # Dashboard only: this is intentionally not a threshold gate yet. It keeps
      # large-file/function/class and import-linter allowlist drift visible in CI.
      - name: Report technical debt metrics
        run: python scripts/report_tech_debt_metrics.py --top 10

      # Ratchet: current debt counts may shrink, but unrelated PRs should not
      # increase hotspot counts or parse/queue-owner violations.
      - name: Check technical debt budget
        run: python scripts/check_tech_debt_budget.py

  typecheck:
    name: Typecheck (critical backend contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install typechecker
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run targeted mypy gate
        run: |
          .venv/bin/mypy \
            --ignore-missing-imports \
            --follow-imports=skip \
            --check-untyped-defs \
            lib/shared/secrets/provider_contract.py \
            lib/shared/secrets/__init__.py \
            lib/shared/http_headers.py \
            services/app/gateway/error_handlers.py \
            scripts/check_production_env_contract.py \
            scripts/check_architecture_ratchets.py

  benchmark-baselines:
    name: Benchmark baselines (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run offline benchmark canaries
        run: |
          .venv/bin/python -m benchmarks.run_benchmark \
            --benchmark toy \
            --out benchmarks/reports/generated/ci/toy
          .venv/bin/python -m benchmarks.run_benchmark \
            --benchmark stress10 \
            --system bm25_session \
            --out benchmarks/reports/generated/ci/stress10_bm25
          .venv/bin/python scripts/run_storyline_batch_benchmark.py \
            --mode build-only \
            --signals-per-storyline 20 \
            --noise-signals 5 \
            --run-id ci-storyline-build \
            --report-root benchmarks/reports/generated/ci/storyline

      - name: Compare retained retrieval baseline
        run: |
          .venv/bin/python -m benchmarks.check_baseline_metrics \
            --baseline benchmarks/baselines/stress10_bm25/metrics_summary.json \
            --current benchmarks/reports/generated/ci/stress10_bm25/metrics_summary.json \
            --absolute-tolerance 0.02

  docs:
    name: Docs (MkDocs strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[docs]"

      - name: Build docs strictly
        run: .venv/bin/mkdocs build --strict

  security-supply-chain:
    name: Security scan + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install pip-audit==2.7.3

      - name: Audit Python dependencies
        run: .venv/bin/pip-audit --local --strict

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build scan image
        run: docker build -t fyraliscore-ci:${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fyraliscore-ci:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: fyraliscore-source.spdx.json

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: fyraliscore-ci:${{ github.sha }}
          format: cyclonedx
          output: fyraliscore-image.cdx.json
          exit-code: "0"

      - name: Generate SBOM checksums
        run: sha256sum fyraliscore-source.spdx.json fyraliscore-image.cdx.json > fyraliscore-sboms.SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.6.0

      - name: Sign SBOM artifacts
        run: |
          cosign sign-blob --yes \
            --bundle fyraliscore-source.spdx.json.sigstore \
            fyraliscore-source.spdx.json
          cosign sign-blob --yes \
            --bundle fyraliscore-image.cdx.json.sigstore \
            fyraliscore-image.cdx.json
          cosign sign-blob --yes \
            --bundle fyraliscore-sboms.SHA256SUMS.sigstore \
            fyraliscore-sboms.SHA256SUMS

      - name: Verify SBOM signatures
        run: |
          COSIGN_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"
          cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle fyraliscore-source.spdx.json.sigstore \
            fyraliscore-source.spdx.json
          cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle fyraliscore-image.cdx.json.sigstore \
            fyraliscore-image.cdx.json
          cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle fyraliscore-sboms.SHA256SUMS.sigstore \
            fyraliscore-sboms.SHA256SUMS
          sha256sum -c fyraliscore-sboms.SHA256SUMS

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fyraliscore-sboms
          path: |
            fyraliscore-source.spdx.json
            fyraliscore-image.cdx.json
            fyraliscore-sboms.SHA256SUMS
            fyraliscore-source.spdx.json.sigstore
            fyraliscore-image.cdx.json.sigstore
            fyraliscore-sboms.SHA256SUMS.sigstore

  migration-filenames:
    name: Migrations (unique prefixes)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Reject duplicate migration prefixes
        run: |
          dupes="$(
            for f in db/migrations/*.sql; do
              basename "$f" | sed -E 's/^([0-9]+)_.*/\1/'
            done | sort | uniq -d
          )"
          if [ -n "$dupes" ]; then
            echo "duplicate migration prefixes detected: ${dupes}" >&2
            exit 1
          fi

  # The frontend (ui/) moved to the demo overlay repo (fyraliscore-demo);
  # its typecheck/test/build CI lives there. Core is backend-only.

  tests:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: company_os
          POSTGRES_PASSWORD: company_os
          POSTGRES_DB: company_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U company_os -d company_os"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://company_os:company_os@localhost:5432/company_os
      COMPANY_OS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (with dev extras)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Apply migrations for schema drift check
        run: .venv/bin/python scripts/apply_db_migrations.py --dsn "$DATABASE_URL"

      - name: Check schema drift
        run: .venv/bin/python scripts/check_schema_drift.py --dsn "$DATABASE_URL"

      # Real-LLM tests are gated by RUN_REAL_LLM and DEEPSEEK_API_KEY (neither
      # set here, so they're skipped). Ollama-marked tests are excluded
      # because we don't spin up Ollama in PR CI — that runs nightly.
      # The workflow subprocess E2Es spawn several long-running services and
      # belong in a dedicated ingestion workflow, not the default PR suite.
      - name: Run unit + integration tests
        run: |
          .venv/bin/python -m pytest \
            --ignore=tests/real_llm \
            -m "not ollama and not real_llm and not subprocess_e2e" \
            -v --tb=short
