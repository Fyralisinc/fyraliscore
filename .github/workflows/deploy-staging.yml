name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run id on main containing signed fyraliscore-sboms."
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to staging host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.6.0

      - name: Download signed SBOM artifacts from CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: fyraliscore-sboms
          path: release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download signed SBOM artifacts from requested CI run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: fyraliscore-sboms
          path: release-artifacts
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signed release artifacts
        run: |
          set -euo pipefail
          cd release-artifacts
          COSIGN_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle fyraliscore-source.spdx.json.sigstore \
            fyraliscore-source.spdx.json
          cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle fyraliscore-image.cdx.json.sigstore \
            fyraliscore-image.cdx.json
          cosign verify-blob \
            --certificate-identity "${COSIGN_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle fyraliscore-sboms.SHA256SUMS.sigstore \
            fyraliscore-sboms.SHA256SUMS
          sha256sum -c fyraliscore-sboms.SHA256SUMS

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_LIGHTSAIL_HOST }}
          username: ${{ secrets.STAGING_LIGHTSAIL_USER }}
          key: ${{ secrets.STAGING_LIGHTSAIL_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_APP_DIR }}"
            PREV_SHA="$(git rev-parse HEAD)"

            echo "==> Pulling latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Rebuilding and restarting staging containers"
            docker compose pull
            docker compose up -d --build --remove-orphans

            echo "==> Waiting for gateway health check"
            if ! timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 3; done'; then
              echo "Gateway failed health after staging deploy; rolling back to ${PREV_SHA}" >&2
              git reset --hard "${PREV_SHA}"
              docker compose up -d --build --remove-orphans
              timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 3; done' || true
              docker compose ps
              exit 1
            fi

            echo "==> Checking product SLO gate"
            if ! python3 scripts/check_product_slo_gate.py \
              --prometheus-url "${PRODUCT_SLO_GATE_PROMETHEUS_URL:-http://localhost:9090}" \
              --wait-seconds "${PRODUCT_SLO_GATE_WAIT_SECONDS:-120}" \
              --interval-seconds "${PRODUCT_SLO_GATE_INTERVAL_SECONDS:-15}" \
              --error-burn-max "${PRODUCT_SLO_GATE_ERROR_BURN_MAX:-2}" \
              --latency-burn-max "${PRODUCT_SLO_GATE_LATENCY_BURN_MAX:-2}"; then
              echo "Product SLO gate failed after staging deploy; rolling back to ${PREV_SHA}" >&2
              git reset --hard "${PREV_SHA}"
              docker compose up -d --build --remove-orphans
              timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 3; done' || true
              docker compose ps
              exit 1
            fi

            echo "==> Staging deployment complete"
            docker compose ps
