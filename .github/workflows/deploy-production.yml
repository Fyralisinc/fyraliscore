name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd ~/fyraliscore

            echo "==> Pulling latest code"
            git fetch origin production
            git reset --hard origin/production

            echo "==> Rebuilding and restarting containers"
            # Migrations auto-apply via the `migrate` one-shot service
            # (gateway/workers depend on it via service_completed_successfully).
            # Kafka topics + S3 bucket are provisioned by kafka-init/minio-init.
            docker compose pull --ignore-buildable || true
            docker compose up -d --build --remove-orphans

            echo "==> Waiting for gateway health check"
            # Larger window: the data plane now boots kafka (start_period 20s)
            # plus the migrate/kafka-init/minio-init one-shots before gateway.
            timeout 180 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 3; done'

            echo "==> Deployment complete"
            docker compose ps
