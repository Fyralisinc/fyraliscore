[pytest]
# Run from agent/ so `tests/conftest.py` puts the agent modules + siblings
# (lib, signing) on sys.path. Tests import the agent modules flat (config,
# agent, license_check, ...) exactly as the daemon does.
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
