# ============================================================================
# Fyralis BYOC Control Plane — compose skeleton
# ----------------------------------------------------------------------------
# One-command bring-up for the VENDOR-owned control plane. Each phase fills in
# its service section below. Until then this file defines the shared networks
# and a single no-op `cp-scaffold` marker service so that
# `docker compose -f docker-compose.control-plane.yml config` parses cleanly.
#
# Networks (see SPRINT_PLAN.md → Shared Contracts → C5):
#   cp-net        internal network shared by all control-plane services.
#   dataplane-net the LOCAL data-plane network the control plane also attaches
#                 to for single-host dev/demo scraping. Declared external so a
#                 missing data plane does not break `up`; create it with
#                 `docker network create dataplane-net` for local scraping, or
#                 leave it absent in CP-only deployments.
#
# Mimir multi-tenancy is keyed by X-Scope-OrgID, injected by the auth proxy
# from the verified client-cert tenant_id — never accepted from outside cp-net.
# ============================================================================

name: fyralis-control-plane

networks:
  cp-net:
    driver: bridge
  dataplane-net:
    external: true

volumes:
  mimir-data:
  loki-data:
  grafana-data:
  ca-data:
  audit-data:
  # Phase 4 — fleet console registry persistence (best-effort JSON under
  # console/data) and the data-plane agent's durable heartbeat buffer (I3).
  console-data:
  agent-state:
  # Phase 5 — operate-the-fleet persistence.
  #   release-registry-data: published signed release bundles + index.json (WS-RELEASE)
  #   config-dist-data:      per-deployment signed config store + signing home (WS-CONFIG)
  #   metering-out:          signed Tier-1 usage rollups + billing exports (WS-METER)
  #   (audit-data is declared above and reused by WS-AUDIT for the hash-chained log.)
  release-registry-data:
  config-dist-data:
  metering-out:

services:
  # --- scaffold marker -------------------------------------------------------
  # Real services replace/augment this as phases land. Kept so the compose file
  # is always valid YAML with at least one service. `up` exits immediately.
  cp-scaffold:
    image: busybox:1.36
    command: ["sh", "-c", "echo 'fyralis control-plane scaffold — fill in services per SPRINT_PLAN.md'"]
    networks:
      - cp-net
    restart: "no"

  # ==========================================================================
  # Phase 2 — auth-proxy + boundary + egress
  # ==========================================================================
  # auth-proxy:
  #   build: ./auth-proxy
  #   # Terminates mTLS, verifies client cert against the Fyralis CA, extracts
  #   # tenant_id from the spiffe://fyralis/tenant/<id> URI SAN (C1), checks the
  #   # tenant_registry.json revocation list, injects X-Scope-OrgID, and routes
  #   # to Mimir/Loki. NEVER trusts a tenant_id from a request header (I4).
  #   ports:
  #     - "8443:8443"   # mTLS ingress for agent dial-home
  #   volumes:
  #     - ./ca/certs:/etc/fyralis/ca:ro
  #     - ./ca/tenant_registry.json:/etc/fyralis/tenant_registry.json:ro
  #   networks:
  #     - cp-net
  #   depends_on:
  #     - mimir
  #     - loki

  # ==========================================================================
  # Phase 3 — Mimir / Loki / Grafana + fleet-SLI   (WS-MIMIR / WS-LOKI-T2 /
  #           central Grafana / WS-FLEETSLI — merged from each dir's
  #           service.compose.yml fragment)
  # ==========================================================================

  # --- Mimir: central MULTI-TENANT metrics store (WS-MIMIR + WS-MIMIR-CARD) --
  # multitenancy_enabled=true ⇒ every request needs X-Scope-OrgID (injected by
  # the auth-proxy from the verified cert SAN; a request without it gets 401).
  # Service name MUST be `mimir` — the auth-proxy reverse-proxies to
  # http://mimir:9009 (auth-proxy/config.py DEFAULT_UPSTREAM_URL). Only reachable
  # from inside cp-net (behind the proxy). The grafana/mimir image is DISTROLESS
  # (no shell/curl) so there is no in-container healthcheck — readiness is the
  # HTTP endpoint GET /ready, probed by the ruler-loader below.
  mimir:
    image: grafana/mimir:2.13.0
    command:
      - -config.file=/etc/mimir/mimir.yaml
    volumes:
      # Main config (multitenancy, all-in-one target, filesystem storage, the
      # per-tenant cardinality budget DEFAULTS in `limits`).
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      # Per-tenant cardinality budget overrides — hot-reloaded every 15s.
      - ./mimir/runtime_overrides.yaml:/etc/mimir/runtime_overrides.yaml:ro
      # Fleet-SLI rule files (read-only). NOT auto-discovered off disk — the
      # filesystem ruler backend stores each group as its own object and does
      # NOT load a directory of multi-group YAML; the rules are PUSHED in by the
      # mimir-ruler-loader below (mimirtool rules load -> ruler API). Mounted
      # here for parity/inspection; the loader is the authoritative path.
      - ./fleet-sli:/etc/mimir/fleet-sli:ro
      # Blocks (tsdb/blocks/compactor), ruler tenant storage, alertmanager.
      - mimir-data:/data
    expose:
      - "9009"   # HTTP API (push + query + ruler) — reached via auth-proxy on cp-net
    ports:
      # Operator-local convenience only. In PRODUCTION do NOT publish this — all
      # access goes through the auth-proxy so X-Scope-OrgID is enforced server-side.
      - "9009:9009"
    networks:
      - cp-net
    restart: unless-stopped

  # --- ruler loader: PUSH fleet-sli rules into the __fleet__ ruler tenant -----
  # One-shot. Waits for Mimir /ready, then uses mimirtool to load EVERY fleet-sli
  # rule file (golden-12 recording + alert + SLO burn-rate groups + the
  # WS-MIMIR-CARD cardinality watchdog) into the synthetic `__fleet__` ruler
  # tenant via the ruler API. This is the canonical loader (a raw filesystem copy
  # yields "no rule groups found"), and it globs BOTH *.yml and *.yaml, so it
  # covers the WS-FLEETSLI *.yml deliverables — superseding the fleet-sli
  # busybox bootstrap (whose disk-copy approach Mimir's ruler does not read).
  mimir-ruler-loader:
    image: grafana/mimirtool:2.13.0
    entrypoint:
      - /bin/sh
      - -c
      # `$$` => a literal `$` to the shell (compose interpolates single `$`).
      - |
        set -e
        echo "waiting for mimir /ready ..."
        i=0
        until wget -q -O- http://mimir:9009/ready 2>/dev/null | grep -qi ready; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then echo "mimir not ready after 120s — giving up"; exit 1; fi
          sleep 2
        done
        echo "mimir ready — loading fleet-sli rules into tenant __fleet__"
        files=""
        for f in /rules/*.yml /rules/*.yaml; do
          [ -e "$$f" ] || continue
          case "$$f" in
            */service.compose.yml|*/docker-compose*.yml) continue ;;
          esac
          files="$$files $$f"
        done
        if [ -z "$$files" ]; then
          echo "WARN: no fleet-sli rule files found under /rules — ruler will have no groups"
          exit 0
        fi
        echo "loading:$$files"
        mimirtool rules load $$files --address=http://mimir:9009 --id=__fleet__
        echo "loaded. current groups:"
        mimirtool rules list --address=http://mimir:9009 --id=__fleet__
    volumes:
      - ./fleet-sli:/rules:ro
    networks:
      - cp-net
    depends_on:
      - mimir
    restart: "no"

  # --- Loki: Tier-2 central MULTI-TENANT log store (WS-LOKI-T2) ---------------
  # auth_enabled=true ⇒ every request needs X-Scope-OrgID. Logs arrive ALREADY
  # REDACTED (boundary OTel Collector strips PII before egress, I1); Loki is the
  # sink, not the redactor. Same injection contract as Mimir (proxy on ingest,
  # operator Grafana on query). Single-binary (-target=all), filesystem storage
  # under /data, compactor-owned retention.
  loki:
    image: grafana/loki:3.4.2
    container_name: cp-loki
    command:
      - "-config.file=/etc/loki/loki.yaml"
      - "-target=all"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      # Per-tenant runtime overrides (limits/retention) — hot-reloaded; the dir
      # may be empty, the file is optional. Mount the dir so the path resolves.
      - ./loki/overrides:/etc/loki/overrides:ro
      # Persistent store: TSDB index + chunks + compactor + WAL, all under /data.
      - loki-data:/data
    ports:
      # In production reached ONLY through the auth-proxy on cp-net; host publish
      # is for single-host dev/demo + healthcheck.
      - "3100:3100"
    networks:
      - cp-net
    # The official image's entrypoint handles uid 10001; keep the volume writable.
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # --- Grafana: central operator UI (fleet + per-customer views) -------------
  # Datasources (provisioned) query Mimir/Loki DIRECTLY over cp-net and set
  # X-Scope-OrgID themselves — the trusted internal OPERATOR QUERY PATH, distinct
  # from the agent mTLS INGEST PATH through the auth-proxy. Per-customer dashboard
  # re-scopes via the ${tenant_scope} variable; fleet view uses __fleet__.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: cp-grafana
    restart: unless-stopped
    depends_on:
      - mimir
      - loki
    environment:
      # ---- operator auth (CHANGE in any real deployment) --------------------
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-fyralis-operator}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # ---- fleet/admin org id used by the "(fleet)" datasources -------------
      FYRALIS_FLEET_ORG_ID: ${FYRALIS_FLEET_ORG_ID:-__fleet__}
      # ---- provisioning paths -----------------------------------------------
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_FEATURE_TOGGLES_ENABLE: ""
      # ---- UX ----------------------------------------------------------------
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet/fleet-overview.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
    volumes:
      # provisioning (datasources + dashboard providers) — read-only
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # dashboard JSON tree (fleet/ + tenant/ subdirs the providers point at)
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # persistent Grafana state (annotations, prefs)
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - cp-net
      # also attach to the local data plane for single-host dev/demo scraping
      - dataplane-net

  # ==========================================================================
  # Phase 2 (customer-VPC side) — boundary OTel Collector
  # ==========================================================================
  # NOTE: the boundary collector runs INSIDE the customer VPC alongside the data
  # plane, not in the vendor control plane. It is documented here for the
  # single-host dev/demo topology only; in production it ships with the agent.
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   # Enforces telemetry tiers (C3): T1 metrics only by default; drops logs
  #   # unless T2; drops traces unless T3. Redacts before any egress (I1).
  #   command: ["--config=/etc/otelcol/config.yaml"]
  #   volumes:
  #     - ./boundary/config.yaml:/etc/otelcol/config.yaml:ro
  #   networks:
  #     - dataplane-net

  # ==========================================================================
  # Phase 4 — Deployment surface (console + data-plane agent)
  #           (WS-CONSOLE / WS-AGENT — merged from each dir's service.compose.yml.
  #            WS-ONBOARD / WS-LICENSE / WS-INSTALLER are on-demand operator/one-
  #            shot tools, not always-on services; run their fragments directly,
  #            e.g. `docker compose -f onboarding/service.compose.yml run --rm ...`.)
  # ==========================================================================

  # --- console: operator UI/API over the fleet registry (WS-CONSOLE) ---------
  # FastAPI/uvicorn over the C4 DeploymentRecord registry. Serves the P4 CONSOLE
  # REST contract (POST /api/v1/register, POST /api/v1/heartbeat, GET
  # /api/v1/deployments[/{id}], GET / rollup) on 8080 on cp-net. Health is
  # DERIVED ON READ from heartbeat freshness (NFR-5: stale >90s -> yellow,
  # missing >300s -> red) — the wire `health` is never trusted.
  #
  # BUILD CONTEXT is the control-plane ROOT (.), NOT ./console — the image needs
  # control-plane/lib (the shared C4 record + derive_health). Dockerfile is at
  # console/Dockerfile. (Same pattern as the auth-proxy/agent images.)
  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    environment:
      - CP_CONSOLE_HOST=0.0.0.0
      - CP_CONSOLE_PORT=8080
      # JSON-file persistence of the fleet registry on the mounted volume so a
      # console restart does not lose the fleet.
      - CP_CONSOLE_DATA_DIR=/app/console/data
      # Heartbeat-age health thresholds (NFR-5 defaults; override to tune).
      - CP_HEARTBEAT_YELLOW_AFTER_S=90
      - CP_HEARTBEAT_RED_AFTER_S=300
    volumes:
      # Durable fleet registry (best-effort JSON persistence under console/data).
      - console-data:/app/console/data
    ports:
      # Operator-facing console UI/API. Reachable on cp-net as http://console:8080;
      # published to the host for the operator.
      - "8080:8080"
    networks:
      - cp-net
    healthcheck:
      # python:3.12-slim has no curl; use the stdlib to probe liveness.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- fyralis-agent: data-plane heartbeat agent (WS-AGENT) ------------------
  # Runs IN THE CUSTOMER VPC (data plane). Every AGENT_INTERVAL_S it collects a
  # C4 DeploymentRecord (version/region/tier/license-expiry + health derived from
  # a local /healthz SLI probe) and POSTs it to the console's /api/v1/heartbeat
  # over an OUTBOUND https call. Console unreachable -> BUFFERS to a durable local
  # queue and retries with backoff (I3 — never crashes, never blocks local ops).
  # Pulls + VERIFIES signed config bundles before applying (I6); refuses
  # privileged actions when its local signed license is missing/expired/tampered.
  #
  # I2 — OUTBOUND ONLY: there is NO `ports:` / EXPOSE here, by design. The agent
  # opens no listening socket; nothing reaches in to it. For the single-host
  # in-cluster demo it attaches to cp-net (to reach the console by name) AND
  # dataplane-net (to probe the local data plane). In a REAL BYOC deploy this runs
  # in the customer VPC and AGENT_CONSOLE_URL is the public vendor-console TLS URL.
  #
  # BUILD CONTEXT is the control-plane ROOT (.) so the image includes signing/
  # (verify_bundle/signing_lib) + lib/ (DeploymentRecord). Dockerfile at
  # agent/Dockerfile.
  fyralis-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: fyralis/agent
    # OUTBOUND-ONLY: no ports published, no listener (I2).
    environment:
      AGENT_CONSOLE_URL: "${AGENT_CONSOLE_URL:-http://console:8080}"
      AGENT_TENANT_ID: "${AGENT_TENANT_ID:-acme}"
      AGENT_DEPLOYMENT_ID: "${AGENT_DEPLOYMENT_ID:-acme-use1-0001}"
      AGENT_REGION: "${AGENT_REGION:-us-east-1}"
      AGENT_TELEMETRY_TIER: "${AGENT_TELEMETRY_TIER:-T1}"
      AGENT_INTERVAL_S: "${AGENT_INTERVAL_S:-30}"
      # Local data-plane health endpoint the agent probes for its SLI-derived health.
      AGENT_HEALTHZ_URL: "${AGENT_HEALTHZ_URL:-http://127.0.0.1:8088/healthz}"
      # Paths inside the container (see mounts below).
      AGENT_VERSION_FILE: "/app/agent/VERSION"
      AGENT_LICENSE_PATH: "/run/secrets/license.json"
      AGENT_TRUST_ROOT: "/app/signing/trust_root.json"
      AGENT_BUFFER_PATH: "/var/lib/fyralis-agent/buffer.jsonl"
      AGENT_CONFIG_DIR: "/var/lib/fyralis-agent/applied-config"
    volumes:
      # The signed license bundle (license.json + sidecars), validated locally (I6).
      # Provide the trio at ./agent/deploy/ on the host (gitignored / per-deploy).
      - ./agent/deploy/license.json:/run/secrets/license.json:ro
      - ./agent/deploy/license.json.sig:/run/secrets/license.json.sig:ro
      - ./agent/deploy/license.json.manifest.json:/run/secrets/license.json.manifest.json:ro
      # PUBLIC trust root only — the agent verifies, never signs.
      - ./signing/trust_root.json:/app/signing/trust_root.json:ro
      # Durable buffer + applied-config survive restarts (I3 / I6).
      - agent-state:/var/lib/fyralis-agent
    depends_on:
      - console
    networks:
      # cp-net so it can reach the console by name for the in-cluster demo;
      # dataplane-net so it can probe the local data plane.
      - cp-net
      - dataplane-net
    restart: unless-stopped
    # NOTE: no healthcheck that opens a port. The control plane observes the agent
    # via its HEARTBEATS, which is the intended health signal (C4).

  # ==========================================================================
  # Phase 5 — Operate the fleet (release / config-dist / metering / audit /
  #           upgrade — merged from each dir's service.compose.yml fragment)
  # ==========================================================================
  # All Phase-5 images build from the control-plane ROOT context (.) with a
  # per-dir dockerfile, exactly like console/fyralis-agent, so each image can
  # COPY in signing/ (sign_bundle/verify_bundle/signing_lib) + lib/. The agent
  # reaches config-dist / release-registry BY SERVICE NAME on cp-net
  # (config-dist:8090, release-registry:8090); the host-port publish is local-
  # dev convenience only. Because two services listen on container port 8090,
  # config-dist keeps host 8090 and release-registry is host-mapped to 8091
  # (container stays 8090 — the in-cluster contract is unchanged).

  # --- release-registry: serves signed release bundles by version (WS-RELEASE) -
  # FastAPI/uvicorn over the on-disk ReleaseRegistry (publish.py serve). Serves
  # bundles in the exact layout the agent's config_pull/verify_bundle consumes:
  #   GET /releases/<version>/<tarball>[.sig|.manifest.json]
  #   GET /releases/latest   GET /index.json   GET /healthz
  # Re-verifies the ed25519 signature before publish/serve (I6). build_release.py
  # and rollout.py are operator/CD CLIs (run on demand), not declared here.
  release-registry:
    build:
      context: .
      dockerfile: release/Dockerfile
    image: fyralis/release-registry
    environment:
      - CP_RELEASE_REGISTRY=/app/release/_registry
      - CP_RELEASE_HOST=0.0.0.0
      - CP_RELEASE_PORT=8090
    command:
      - python
      - release/publish.py
      - serve
      - --registry
      - /app/release/_registry
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
    volumes:
      - release-registry-data:/app/release/_registry
    ports:
      # Host-published on 8091 to avoid colliding with config-dist's 8090; the
      # container still listens on 8090, so on cp-net it is release-registry:8090.
      - "8091:8090"
    networks:
      - cp-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- config-dist: signed per-deployment config distribution (WS-CONFIG) ------
  # FastAPI/uvicorn over the per-deployment, versioned, ed25519-SIGNED ConfigStore
  # (flags + telemetry_tier (C3) + token-rotation schedule (FR-D4)). Implements the
  # exact agent-pull contract (agent/config_pull.py): GET /config/{deployment_id}
  # [.sig|.manifest.json] + GET /trust_root.json. A tier change / flag flip is a
  # NEW signed version (no redeploy); the agent verifies-before-apply (I6). Signs
  # with its own active key under the persisted signing home (mount a shared CP
  # keystore + set CONFIG_DIST_SIGNING_HOME/KEY_ID to chain to one trust root).
  config-dist:
    build:
      context: .
      dockerfile: config-dist/Dockerfile
    image: fyralis/config-dist
    environment:
      CONFIG_DIST_PORT: "8090"
      CONFIG_DIST_STORE_ROOT: /data/store
      CONFIG_DIST_SIGNING_HOME: /data/signing-home
      CONFIG_DIST_KEY_ID: cp-config-dist
    volumes:
      - config-dist-data:/data
    command:
      - python
      - -m
      - uvicorn
      - config_service:app
      - --app-dir
      - /app/config-dist
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      # Local/dev inspection only; in production the agent reaches this ONLY
      # through the auth-proxy on cp-net (mTLS-terminated, tenant-scoped).
      - "8090:8090"
    networks:
      - cp-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- metering: signed Tier-1 usage rollup BATCH job (WS-METER, FR-F2/F3) -----
  # Reads AGGREGATE Tier-1 counters out of central Mimir one tenant at a time via
  # X-Scope-OrgID (C5) — obs-per-source, think_runs, think cost_usd, ingestion
  # volume — computes a per-tenant usage rollup over a billing period and SIGNS it
  # (ed25519) so usage is tamper-evident (FR-F2). export.py emits signed rollups
  # for billing. One-shot CONTROL-PLANE job (wrap with a scheduler for monthly
  # close); NEVER dials a data plane (I2) — it only reads Mimir on cp-net. The
  # default command runs the OFFLINE self-test so `up` proves the image is wired;
  # override `command` to bill for real (see metering/README.md).
  metering:
    build:
      context: .
      dockerfile: metering/Dockerfile
    image: fyralis/metering
    environment:
      # Point at the auth-proxy to have the proxy inject X-Scope-OrgID from the
      # cert SAN instead of the job setting it itself (defence in depth).
      MIMIR_URL: "http://mimir:9009"
    volumes:
      # Private signing key + trust root, read-only (image carries no secret).
      - ./signing/keys:/app/signing/keys:ro
      - ./signing/trust_root.json:/app/signing/trust_root.json:ro
      # Where signed rollups + billing exports land (persisted for billing).
      - metering-out:/app/metering/out
    networks:
      - cp-net
    command: ["python", "/app/metering/selftest.py"]
    restart: "no"

  # --- audit: append-only hash-chained audit log + break-glass (WS-AUDIT, I5) --
  # On-demand CLI image (NOT a daemon) — run via `docker compose run --rm audit
  # <args>`. Provides the append-only, hash-chained audit log (FR-G) + the
  # customer-granted, scoped, time-boxed break-glass workflow (I5). Each append
  # re-signs an ed25519 chain-head checkpoint (whole-file tamper-evidence on top of
  # the hash chain). The log + grant store persist on the audit-data volume so the
  # chain survives restarts. Default command verifies the chain.
  audit:
    build:
      context: .
      dockerfile: audit/Dockerfile
    image: fyralis/audit
    environment:
      AUDIT_LOG: /data/audit.log.jsonl
      AUDIT_STORE: /data/breakglass_grants.json
    volumes:
      - audit-data:/data
      # Private signing key + trust root, read-only so the image carries no secret.
      - ./signing/keys:/app/signing/keys:ro
      - ./signing/trust_root.json:/app/signing/trust_root.json:ro
    command: ["--log", "/data/audit.log.jsonl", "--store", "/data/breakglass_grants.json", "audit", "verify"]
    networks:
      - cp-net
    restart: "no"

  # --- cp-upgrade-tools: on-demand CP-upgrade operator container (WS-CP-UPGRADE) -
  # NOT an always-on service. Carries the trust-overlap helper + rolling-upgrade /
  # trust-overlap scripts + a python with cryptography so an operator can run the
  # FR-A5 CA-rotation dance and the NFR-6 rolling restart from inside cp-net.
  # Publishes NO ports and runs NO daemon (restart: "no"; I2 intact). Run via
  # `docker compose run --rm cp-upgrade-tools <cmd>` (see upgrade/UPGRADE_RUNBOOK.md).
  cp-upgrade-tools:
    image: python:3.12-slim
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        pip install --quiet --no-cache-dir cryptography pyyaml >/dev/null 2>&1 || \
          pip install --quiet cryptography pyyaml
        exec "$@"
      - sh
    command:
      - python
      - upgrade/trust_bundle.py
      - list
      - ca/pki/ca-chain.crt
    volumes:
      # Mount the whole control-plane tree read-write so the operator can edit the
      # trust bundle in place (ca/pki is gitignored; this is the live bundle).
      - .:/app
      # OPTIONAL: to let this container ALSO drive `docker compose` for the rolling
      # restart, uncomment the docker socket mount. Off by default (privileged).
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cp-net
    restart: "no"
