# Internal documentation site for Fyralis Core.
# Build/preview locally:  mkdocs serve   (deps: pip install -e ".[docs]")
# Strict build:           mkdocs build --strict
# This site is internal coordination/understanding docs — NOT a public API/SDK ref.
site_name: Fyralis Core — Internal Docs
site_description: >-
  Internal engineering and AI-agent documentation for Fyralis Core, the
  organizational-intelligence runtime. How the system works and why.
site_url: https://fyralisinc.github.io/fyraliscore/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections   # group nav by section
    - navigation.top        # back-to-top button
    - navigation.instant    # SPA-style instant loading
    - navigation.tracking   # update URL with the active anchor
    - toc.follow            # keep the ToC in sync while scrolling
    - search.suggest        # search-as-you-type suggestions
    - search.highlight      # highlight matches on the result page
    - content.code.copy     # copy button on code blocks
    - content.tooltips      # rich tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible slugs so hand-authored TOCs (e.g. reference/FYRALIS.md)
      # with "## A / B" → #a--b anchors resolve under --strict.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Material's built-in Mermaid support (no separate plugin needed).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# Build hook: rewrites the legacy ingestion/github-intelligence trees' source-file
# links (../../services/*.py, etc.) into GitHub blob URLs at build time so they
# build under --strict, without modifying the markdown on disk. See docs_hooks.py.
hooks:
  - docs_hooks.py

# A few pre-existing docs/ trees are point-in-time artifacts (test reports, a v1
# prompt log, an HTML mockup, a long backlog). They're kept on disk but excluded
# from the built site. The ingestion/ and github-intelligence/ deep-dives ARE
# built (their source links are rewritten by the hook above).
exclude_docs: |
  history/
  testing/
  mockups/
  hardening-backlog.md

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - App — Gateway & Transport: architecture/app.md
      - Ingest — Signal Intake: architecture/ingest.md
      - Reasoning — Think Pipeline: architecture/reasoning.md
      - Domain — Substrate: architecture/domain.md
      - Product — CEO Surfaces: architecture/product.md
      - Platform — Authz & Routing: architecture/platform.md
      - Workers — Background Jobs: architecture/workers.md
      - Shared Libraries (lib): architecture/lib.md
      - Runtime & Data Plane: architecture/data-plane.md
  - Services: services.md
  - Glossary: glossary.md
  - Codebase reference:
      - Architecture & module map: reference/CODEBASE-ARCHITECTURE.md
      - Codebase management (the why): reference/CODEBASE-MANAGEMENT.md
      - Comprehensive reference: reference/FYRALIS.md
      - Memory & model layer: memory-layer.md
  - Codebase status:
      - Overview: status/index.md
      - Feature status: status/feature-status.md
      - Wiring gaps: status/wiring-gaps.md
      - Legacy & test-only: status/dead-legacy.md
      - Inquiry retrieval gap analysis: status/inquiry-retrieval-gap-analysis.md
  - Decisions (ADRs):
      - Overview: adr/README.md
      - ADR Template: adr/0000-template.md
      - 0001 · Kafka-first ingestion default: adr/0001-kafka-first-ingestion-default.md
      - 0002 · Main is the single integration trunk: adr/0002-main-is-the-single-integration-trunk.md
      - 0003 · Telegram MTProto ingestion: adr/0003-telegram-mtproto-user-account-ingestion.md
  - Subsystem deep-dives:
      - About these docs: deep-dives.md
      - Ingestion:
          - Overview: ingestion/README.md
          - Canonical architecture: ingestion/architecture.md
          - Source isolation: ingestion/source-isolation.md
          - Finance sources: ingestion/finance-sources.md
          - Finance API map: ingestion/finance-api-map.md
          - Slack DM (test env): ingestion/slack-dm-demo.md
          - Sources:
              - Slack: ingestion/sources/slack.md
              - GitHub: ingestion/sources/github.md
              - Discord: ingestion/sources/discord.md
              - Gmail: ingestion/sources/gmail.md
              - Notion: ingestion/sources/notion.md
              - Google Calendar: ingestion/sources/google-calendar.md
              - Google Drive: ingestion/sources/google-drive.md
              - Jira: ingestion/sources/jira.md
              - Grafana: ingestion/sources/grafana.md
              - Telegram (MTProto): ingestion/sources/telegram.md
      - GitHub Intelligence:
          - Spec & plan: github-intelligence/plan.md
          - Implementation status: github-intelligence/IMPLEMENTATION.md
          - Read API: github-intelligence/API.md
          - Browser UI: github-intelligence/UI.md
