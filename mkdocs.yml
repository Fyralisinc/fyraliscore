# Internal documentation site for Fyralis Core.
# Build/preview locally:  mkdocs serve   (deps: pip install -e ".[docs]")
# Strict build:           mkdocs build --strict
# This site is internal coordination/understanding docs — NOT a public API/SDK ref.
site_name: Fyralis Core — Internal Docs
site_description: >-
  Internal engineering and AI-agent documentation for Fyralis Core, the
  organizational-intelligence runtime. How the system works and why.
site_url: https://fyralisinc.github.io/fyraliscore/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections   # group nav by section
    - navigation.top        # back-to-top button
    - navigation.instant    # SPA-style instant loading
    - navigation.tracking   # update URL with the active anchor
    - toc.follow            # keep the ToC in sync while scrolling
    - search.suggest        # search-as-you-type suggestions
    - search.highlight      # highlight matches on the result page
    - content.code.copy     # copy button on code blocks
    - content.tooltips      # rich tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible slugs so hand-authored TOCs (e.g. reference/FYRALIS.md)
      # with "## A / B" → #a--b anchors resolve under --strict.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Material's built-in Mermaid support (no separate plugin needed).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# Build hook: rewrites the legacy ingestion/ tree's source-file
# links (../../services/*.py, etc.) into GitHub blob URLs at build time so they
# build under --strict, without modifying the markdown on disk. See docs_hooks.py.
hooks:
  - docs_hooks.py

# A few pre-existing docs/ trees are point-in-time artifacts (test reports, a v1
# prompt log, an HTML mockup, a long backlog). They're kept on disk but excluded
# from the built site. The ingestion/ deep-dive IS
# built (its source links are rewritten by the hook above).
exclude_docs: |
  history/
  testing/
  mockups/
  research/
  hardening-backlog.md

