# =====================================================================
# docker-compose.sandbox.yml — local real-API sandbox overlay
# =====================================================================
# Overlay on top of docker-compose.yml for testing the ingestion
# pipeline (backfill + live, concurrently) against the REAL GitHub /
# Slack / Discord APIs while every Fyralis service runs locally.
#
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#   (or just: scripts/sandbox_up.sh)
#
# What it changes vs the base prod stack:
#   1. env_file → [.env, .env.sandbox] (REPLACES the base's required
#      .env.production via the `!override` tag). Reuses the real creds +
#      MASTER_KEK already in .env; .env.sandbox supplies the overrides.
#   2. Publishes the gateway on host :8000 so `ngrok http 8000` (run on
#      the host) can give it a public HTTPS URL for webhooks + OAuth.
#   3. Disables the services a non-Gmail local sandbox does not need:
#      non-Slack live/background workers (no provider creds → would crash-loop),
#      and the demo UI / nginx-proxy / acme / think workers (the cloud-deploy
#      edge + reasoning layer, irrelevant to Slack ingestion validation). They
#      are parked under the `full` profile — bring them in deliberately
#      with `--profile full` if ever needed.
#
# Gmail/Calendar/Drive and other live workers are intentionally absent from the
# default sandbox. Bring them in deliberately with `--profile full`.

x-sb-envfile: &sb-envfile
  # The extracted github-intel extension is private/optional. Slack sandbox
  # validation must be runnable without GitHub package credentials, so build the
  # core image only unless an operator deliberately overrides this overlay.
  build:
    context: .
    args:
      GITHUB_INTEL_REF: ""
  # `!override` tells Compose to REPLACE the base service's env_file
  # (.env.production, which need not exist here) rather than append to it.
  env_file: !override
    - .env
    - .env.sandbox
  # The base compose file models production. This overlay is explicitly
  # local/sandbox, so keep the environment name aligned with the tenant
  # fallbacks that .env supplies.
  environment:
    COMPANY_OS_ENV: dev
    FYRALIS_ENV: dev
    FYRALIS_SOURCE_REHEARSAL_ENABLED: "1"
    FYRALIS_SLACK_REHEARSAL_ENABLED: "1"
    FYRALIS_SOURCE_AUTO_CONNECT_EXECUTE_BROWSER_DOM: "1"
    FYRALIS_SOURCE_AUTO_CONNECT_HEADLESS_BROWSER: "1"
  # GitHub App private key (multi-line PEM can't live in env_file) — mount
  # it read-only from the gitignored .secrets/ dir; .env.sandbox points
  # GITHUB_APP_PRIVATE_KEY_PATH here. Harmless on workers that don't read it.
  volumes:
    - ./.secrets/github_app.pem:/run/secrets/github_app.pem:ro

services:
  # ---- infra: keep host ports UNPUBLISHED so the sandbox can coexist
  # with a dev stack already holding :5432 / :11434. The sandbox is
  # self-contained on its own network; helper scripts run INSIDE the
  # containers (docker compose exec gateway ...), so no host DB/ollama
  # port is needed. (`!override []` replaces the base service's ports.)
  postgres:
    # Published on host :5434 (not 5432) so a host pgAdmin/psql can
    # connect without colliding with the dev stack. Internal port stays
    # 5432 (what the workers use over the compose network).
    ports: !override
      - "5434:5432"
  ollama:
    ports: !override []

  # ---- ingress: publish to host so host-side ngrok can reach it ------
  gateway:
    <<: *sb-envfile
    ports:
      - "8000:8000"

  # ---- backfill / onboarding loops -----------------------------------
  oauth_poller: { <<: *sb-envfile }
  tenant_onboarding: { <<: *sb-envfile }
  source_onboarding: { <<: *sb-envfile }
  shard_fetch: { <<: *sb-envfile }
  reconciler:
    <<: *sb-envfile
    profiles: ["full"]
  periodic_reconciler:
    <<: *sb-envfile
    profiles: ["full"]

  # ---- Kafka consumer chain ------------------------------------------
  normalizer: { <<: *sb-envfile }
  observation_writer: { <<: *sb-envfile }
  dlq_writer: { <<: *sb-envfile }
  summarization_worker: { <<: *sb-envfile }
  summarization_batch_worker: { <<: *sb-envfile }
  embedding_worker: { <<: *sb-envfile }
  embedding_backlog: { <<: *sb-envfile }

  # ---- live source worker (real Discord gateway WSS) -----------------
  discord_gateway_worker:
    <<: *sb-envfile
    profiles: ["full"]

  # ---- one-shots that load creds (env_file) --------------------------
  migrate: { <<: *sb-envfile }
  kafka-init: { <<: *sb-envfile }

  # ---- parked under `full` profile: not started by default ----------
  extension_workers:
    profiles: ["full"]
  feels_onboarded_monitor:
    profiles: ["full"]
  circuit_breaker:
    profiles: ["full"]
  telegram_gateway_worker:
    profiles: ["full"]
  signal_gateway_worker:
    profiles: ["full"]
  gmail_watch_scheduler:
    profiles: ["full"]
  gmail_history_poller:
    profiles: ["full"]
  google_calendar_live_poller:
    profiles: ["full"]
  google_drive_live_poller:
    profiles: ["full"]
  google_calendar_watch_scheduler:
    profiles: ["full"]
  google_drive_watch_scheduler:
    profiles: ["full"]
  think_worker:
    profiles: ["full"]
  post_commit_worker:
    profiles: ["full"]
  anomaly_processor_worker:
    profiles: ["full"]
  entity_resolver_worker:
    profiles: ["full"]
  schema_drift_monitor:
    profiles: ["full"]
  sage_structural_features_worker:
    profiles: ["full"]
  sage_topology_optimizer_worker:
    profiles: ["full"]
  housekeeper_worker:
    profiles: ["full"]
  relationship_ontology_proposals_worker:
    profiles: ["full"]
  # ui / nginx-proxy / acme-companion moved to the demo overlay repo
  # (docker-compose.demo.yml); the sandbox no longer parks them here.
