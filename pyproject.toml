[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-os"
version = "0.0.0"
description = "Company OS — organizational intelligence runtime"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=15.0",          # IN-12: Discord Gateway WSS worker
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",      # used only by scripts/check_schema_drift.py (sync)
    "zstandard>=0.22",           # required to read/write .sql.zst demo snapshots
    "anthropic>=0.34",
    "openai>=1.40",
    "pynacl>=1.5",               # IN-06: Discord ed25519 webhook verification
    "cryptography>=42.0",        # IN-08: Fernet envelope-encrypted secret store
    "pyjwt[crypto]>=2.8",        # IN-13: GitHub App JWT (RS256) minting
    "zstandard>=0.22",           # Gmail/general payload compression
    "google-auth>=2.29",         # IN-Gmail: Google OAuth/OIDC verification
    "redis>=5.0",                # M1.3: rate limiter (Lua EVALSHA on Redis); LLD §13
    # --- Ingestion M1.4 (LLD §9 dependency adds) ---
    "temporalio>=1.5",                          # Temporal Python SDK
    "confluent-kafka>=2.3",                     # idempotent producer
    "aiokafka>=0.10",                           # consumer
    # M2.3: aiokafka's zstd / lz4 codecs require cramjam at runtime.
    # The shadow-path producer (M2.1) writes zstd-compressed batches;
    # the normalizer's aiokafka consumer must be able to decompress
    # them. Without this dep the consumer raises
    # UnsupportedCodecError on the first compressed batch.
    "cramjam>=2.8",                             # aiokafka zstd/lz4 codec backend
    "aioboto3>=12.0",                           # S3 / R2 client
    # M2.2: pinned minor — canonical JSON via OPT_SORT_KEYS is the
    # raw-body bytes for the Discord Gateway shadow path. content_hash
    # dedup + N2 replay-from-raw both require byte-equal serialization
    # across deployments. Patch updates are allowed; major/minor bumps
    # require re-verifying the round-trip test in
    # services/ingest/integrations/discord/gateway/tests/test_dispatch_shadow.py.
    "orjson>=3.11,<3.12",                       # normalizer hot path + Gateway shadow canonical bytes
    "opentelemetry-api>=1.20",                  # tracing
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-asyncpg>=0.40b0",
    "opentelemetry-instrumentation-aiokafka>=0.40b0",
    # M-Load: mmh3 for librdkafka-compatible murmur2 partition hashing
    # used by services/app/webhooks/router.py::_kafka_partition_for_tenant.
    # Pin minor; librdkafka's partitioner algorithm is stable across
    # versions but bumping mmh3 should be re-verified against the
    # actual landing partition (test_kafka_partition_lookup_matches_actual_landing_partition).
    "mmh3>=4.1,<5.0",
    "pypdf>=4.0",                               # IN-16: Google Drive PDF text extraction (pure-Python, no system deps)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "respx>=0.21",              # httpx mocking for unit tests
    "httpx2>=2.3",              # Starlette TestClient backend in newer FastAPI/Starlette
    "freezegun>=1.5",
    "hdbscan>=0.8.40",          # Wave 4-C precipitation clustering
    "scikit-learn>=1.4",        # transitive via hdbscan; used by precipitation
    "numpy>=2.0",               # transitive; model-embedding stacking
    "umap-learn>=0.5",          # 2D projection for the CEO Map view (preserves local structure;
                                # PCA was the wrong abstraction — see CODEBASE-ARCHITECTURE.md §13.13)
    "pyyaml>=6.0",              # real-LLM scenario YAML loader
    "fakeredis[lua]>=2.20",     # M1.3: in-process Redis with Lua EVALSHA support
    "moto[s3,server]>=5.0",     # M1.4: in-process S3 mock for raw_tier tests.
                                # M6.7 (A27.6): the [server] extra (pulls flask)
                                # runs a real moto S3 HTTP endpoint for the
                                # OAuth→completion subprocess tests, whose
                                # shard_fetch subprocess writes raw bodies to S3.
    # M2.3: real-broker Kafka tests (cooperative-sticky rebalance) require
    # an actual Kafka cluster. `testcontainers[kafka]` spins one up per
    # test; the test asserts `@pytest.mark.requires_docker` and skips
    # cleanly when Docker isn't available.
    "testcontainers[kafka]>=4.0",
    "import-linter>=2.0",       # architecture: enforce layer import boundaries
]
# Internal documentation site (MkDocs). Build/serve locally with `mkdocs serve`;
# not part of the runtime or test path. mkdocs-material pulls in mkdocs and
# pymdown-extensions (used for the Mermaid superfences in mkdocs.yml), so no
# separate mermaid plugin is required. See docs/ and CONTRIBUTING / CLAUDE.md.
docs = [
    "mkdocs-material>=9.5",     # Material theme; brings mkdocs + pymdown-extensions
]
# IN-TELEGRAM: Telegram ingestion uses the MTProto user-account API via Telethon
# (ADR-0003). OPTIONAL — the production backfill client + live gateway worker
# import telethon lazily (inside connect()/run_forever()), and the synthetic
# validation harness drives the seams with a mock, so neither the runtime import
# graph nor the test suite requires telethon. Install only on hosts that run a
# real Telegram live worker: `pip install 'fyraliscore[telegram]'`.
telegram = [
    "telethon>=1.36",          # pure-Python asyncio MTProto client
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "services*"]
exclude = ["tests*", "ui*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "lib", "services", "scripts"]
python_files = ["test_*.py", "*_test.py"]
timeout = 30
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:asyncpg.*",
    # asyncpg / asyncio selector can log unclosed-connection warnings
    # from __del__ deallocators during pytest teardown. These are not
    # actionable from test code and surface as PytestUnraisableException.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # umap-learn emits an ImportWarning when tensorflow isn't installed
    # (parametric variant unavailable) — we don't use parametric UMAP.
    "ignore::ImportWarning:umap.*",
    # umap also UserWarns about n_jobs vs random_state — we set both
    # deliberately for determinism.
    "ignore::UserWarning:umap.*",
    # numba emits NumbaDeprecation/PendingDeprecation warnings transitively.
    "ignore::DeprecationWarning:numba.*",
    "ignore::PendingDeprecationWarning:numba.*",
]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: requires live Postgres (DATABASE_URL)",
    "ollama: requires live Ollama (OLLAMA_URL)",
    "slow: slow test (> 1s)",
    "subprocess_e2e: multi-process workflow end-to-end test; run outside the default PR pytest job",
    "real_llm: real-LLM test (requires configured provider auth, runs only with RUN_REAL_LLM=1 or -m real_llm)",
    "requires_infra: requires external infrastructure not provisioned in M1 (pgbouncer, Kafka broker, Temporal cluster, real Redis, S3/R2 endpoint). Skipped unless the environment provides the named service.",
    "requires_docker: requires a running Docker daemon and (typically) the M2 dev compose stack (docker-compose.dev.yml — Kafka, moto-s3). Skipped cleanly when Docker isn't available.",
    "contract: real-provider contract test — asserts our code parses physical JSON fixtures captured from real provider payloads/docs (tests/contract/), distinct from the synthetic mocks.",
]

# ---------------------------------------------------------------------------
# Architecture boundary enforcement (import-linter).
#
# Run:  lint-imports        (installed via the [dev] extra)
#
# These contracts encode ONLY invariants that are empirically true today, so
# the check is green on a clean tree and a violation always means a real
# regression — not an aspirational rule the codebase already breaks. The known
# layer-up coupling that does exist (services.domain.models.repo -> reasoning/
# product) is documented in CODEBASE-MANAGEMENT.md as tracked tech-debt rather
# than enforced against, to keep this gate honest.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["lib", "services"]
# Required so the "no overlay imports" contract below can name external modules
# (fyralis_demo / demo / simulation live in the demo overlay repo, not here).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core never imports the demo / simulation overlays"
type = "forbidden"
# Core is a pure runtime. The demo overlay (the fyralis-demo repo) plugs in via
# entry-point seams (gateway extensions, the event bus, reasoning augmentors) —
# core must never import it back. Catches a re-introduced overlay dependency.
source_modules = ["lib", "services"]
forbidden_modules = ["fyralis_demo", "demo", "simulation"]

[[tool.importlinter.contracts]]
name = "lib is independent of services (shared libraries never import app code)"
type = "forbidden"
source_modules = ["lib"]
forbidden_modules = ["services"]
# Documented exceptions. The first three are deliberate lazy (function-local)
# imports in the LLM provider so reasoning schemas/circuit-breaker stay
# decoupled at module-load time; the rest are test-only fixtures in lib/.
ignore_imports = [
    "lib.llm.provider -> services.reasoning.think.circuit_breaker",
    "lib.llm.provider -> services.reasoning.think.diff_schema",
    "lib.llm.provider -> services.reasoning.think.strict_schema",
    "lib.llm.tests.test_provider -> services.reasoning.think.diff_schema",
    "lib.integrations.tests.test_endpoints -> services.ingest.integrations.gmail.client",
    "lib.integrations.tests.test_endpoints -> services.ingest.integrations.github.client",
    "lib.integrations.tests.test_endpoints -> services.ingest.integrations.slack.client",
    "lib.integrations.tests.test_endpoints -> services.ingest.integrations.discord.client",
]

[[tool.importlinter.contracts]]
name = "reasoning core does not directly import the app, product, or ingest layers"
type = "forbidden"
source_modules = ["services.reasoning"]
forbidden_modules = [
    "services.app",
    "services.product",
    "services.ingest",
]
# Direct-only: this catches a reasoning module that *newly* reaches up into a
# gateway/product/ingest helper (the common regression). A transitive path
# already exists today (reasoning -> domain.models.repo -> product.*); that
# upward edge in models.repo is documented as tracked debt in
# CODEBASE-MANAGEMENT.md, so enforcing transitively here would be a red gate
# for a pre-existing condition rather than a guard against new regressions.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain does not add new imports of reasoning internals"
type = "forbidden"
source_modules = ["services.domain"]
forbidden_modules = ["services.reasoning"]
# Ratchet contract from ARCHITECTURE-REPAIR-PLAN D2/D5: these are the
# currently-known upward edges. New domain -> reasoning imports fail CI; repair
# moves delete allowlist rows as ModelsRepo side effects are inverted.
ignore_imports = [
    "services.domain.models.constructor -> services.reasoning.synthesis.operational_facets",
    "services.domain.models.edges_repo -> services.reasoning.relationships.ontology_runtime",
    "services.domain.models.repo -> services.reasoning.sage.affordances.policy",
    "services.domain.models.repo -> services.reasoning.think.audit",
    "services.domain.models.repo -> services.reasoning.topology",
    "services.domain.models.repo -> services.reasoning.topology.anchor",
    "services.domain.models.tests.test_batch -> services.reasoning.retrieval.config",
    "services.domain.models.tests.test_batch -> services.reasoning.retrieval.primary",
    "services.domain.models.tests.test_model_quality_suite -> services.reasoning.relationships.candidates",
    "services.domain.models.tests.test_model_quality_suite -> services.reasoning.think.applier",
    "services.domain.models.tests.test_model_quality_suite -> services.reasoning.think.diff_schema",
    "services.domain.models.tests.test_model_quality_suite -> services.reasoning.think.quality_gate",
    "services.domain.models.tests.test_model_quality_suite -> services.reasoning.think.splitter",
    "services.domain.models.tests.test_model_quality_suite -> services.reasoning.think.tests.conftest",
    "services.domain.models.tests.test_operational_memory_stress -> services.reasoning.synthesis.operational_facets",
]

[[tool.importlinter.contracts]]
name = "domain does not add new imports of product code"
type = "forbidden"
source_modules = ["services.domain"]
forbidden_modules = ["services.product"]
# Ratchet for ARCHITECTURE-REPAIR-PLAN D2: the auto-accept loop in ModelsRepo is
# tracked debt, not a pattern to extend.
ignore_imports = [
    "services.domain.models.repo -> services.product.recommendations.handlers",
]

[[tool.importlinter.contracts]]
name = "ingest does not add new imports of app code"
type = "forbidden"
source_modules = ["services.ingest"]
forbidden_modules = ["services.app"]
# Existing app-coupled integration tests and synthetic live drivers are
# allowlisted so the contract catches new ingestion runtime dependencies on the
# gateway/webhook layer without a broad rewrite first.
ignore_imports = [
    "services.ingest.ingestion.planners.tests.test_slack_dm -> services.app.gateway.slack_router",
    "services.ingest.ingestion.tests.conftest -> services.app.gateway.db_bootstrap",
    "services.ingest.integrations.discord.gateway.dispatch -> services.app.webhooks.tenant_resolver",
    "services.ingest.integrations.discord.gateway.tests.conftest -> services.app.webhooks.tenant_resolver",
    "services.ingest.integrations.github.gateway_wiring -> services.app.gateway.logging_config",
    "services.ingest.integrations.gmail.tests.test_e2e_mock -> services.app.gateway.db_bootstrap",
    "services.ingest.integrations.gmail.tests.test_oidc_verify -> services.app.webhooks.signatures.google_oidc",
    "services.ingest.integrations.gmail.tests.test_pubsub_shadow -> services.app.webhooks.gmail_pubsub",
    "services.ingest.integrations.tests.conftest -> services.app.gateway.main",
    "services.ingest.integrations.tests.conftest -> services.app.gateway.rate_limit",
    "services.ingest.integrations.tests.test_google_push_channels -> services.app.webhooks.google_push",
    "services.ingest.integrations.tests.test_ingest_discord -> services.app.gateway.main",
    "services.ingest.integrations.tests.test_ingest_discord -> services.app.gateway.rate_limit",
    "services.ingest.integrations.tests.test_ingest_discord -> services.app.webhooks.tests.conftest",
    "services.ingest.integrations.tests.test_uninstall -> services.app.gateway.main",
    "services.ingest.integrations.tests.test_uninstall -> services.app.gateway.rate_limit",
    "services.ingest.integrations.tests.test_uninstall -> services.app.webhooks.tests.conftest",
    "services.ingest.integrations.tests.test_uninstall_discord -> services.app.gateway.main",
    "services.ingest.integrations.tests.test_uninstall_discord -> services.app.gateway.rate_limit",
    "services.ingest.integrations.tests.test_uninstall_discord -> services.app.webhooks.tests.conftest",
    "services.ingest.synthetic.live_generators.tests.test_discord_gateway -> services.app.webhooks.tenant_resolver",
    "services.ingest.synthetic.live_generators.tests.test_github_webhook -> services.app.gateway.main",
    "services.ingest.synthetic.live_generators.tests.test_github_webhook -> services.app.gateway.rate_limit",
    "services.ingest.synthetic.live_generators.gmail_pubsub -> services.app.webhooks.gmail_pubsub",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.ashby",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.brex",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.deel",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.figma",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.fireflies",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.grafana",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.gusto",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.hibob",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.jira",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.mercury",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.miro",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.quickbooks",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.signatures.ramp",
    "services.ingest.synthetic.live_generators.tests.test_gmail_pubsub -> services.app.webhooks.gmail_pubsub",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.tenant_resolver",
    "services.ingest.synthetic.live_generators.tests.test_hmac_webhook -> services.app.webhooks.verifier",
    "services.ingest.synthetic.live_generators.tests.test_slack_webhook -> services.app.gateway.main",
