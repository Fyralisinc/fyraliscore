expected_behaviors:
  - "Materialization creates a large but coherent tenant with actors, customers, goals, commitments, decisions, aliases, and customer-commitment links."
  - "Customer-risk retrieval for Nimbus Bank surfaces SAML incident evidence, audit export scope, renewal risk, SOC2/security constraints, and the relevant commitments."
  - "Customer-risk retrieval for Axion Robotics Inc joins AXN Robotics and Axion Robotics Inc evidence without treating them as separate customer worlds."
  - "Northstar Insurance retrieval connects alias drift, adoption reality, CFO renewal requirement, and the renewal-risk review commitment."
  - "Meridian Energy Corp retrieval distinguishes legal/security expansion risk from generic sales optimism."
  - "ParcelPilot retrieval connects disputed usage, replay idempotency, ledger reconciliation, and the self-serve pause decision."
  - "Insights Graph retrieval separates observed evidence from inference and includes falsifier expectations for Kestrel Labs and Summit Retail Group."
  - "Latency retrieval connects infrastructure alerts with customer impact and does not hide bulk-backfill staleness behind priority-lane recovery."
  - "Forecast reasoning weighs contradictory signals by source trust, recency, customer revenue, and commitment state."
  - "Noisy low-confidence signals are preserved but should be dominated by authoritative clarifications when producing action recommendations."
