scenario_id: scale_chaos_b2b
scenario_name: "Scale-chaos B2B SaaS customer corpus"
description: |
  A synthetic but production-shaped corpus for a mid-market B2B SaaS company
  called Fyralis. It is designed to stress the memory and retrieval system as
  customer data grows: more actors, more customers, more commitments, more
  aliases, more cross-functional drift, and more contradictions.

  Test focus: customer-context retrieval at volume, hidden relationship
  discovery, alias drift, revenue-at-risk reasoning, cross-functional causal
  chains, noisy but important signals, stale decisions, and multi-week chaos.

