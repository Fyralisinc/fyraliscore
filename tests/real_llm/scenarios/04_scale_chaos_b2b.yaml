      decision_text: "For the next release window, engineering capacity goes first to retrieval correctness, model memory quality, and customer-context coherence."
      state: "active"
      scope: {area: "company"}
      revisit_triggers: {triggers: ["material customer miss", "retrieval precision below launch threshold", "enterprise renewal risk caused by stale context"]}
    - title: "Make Insights Graph the operating memory spine"
      decision_text: "Insights Graph is the core system concept: observations, models, commitments, customers, decisions, and recommendations should be connected around it."
      state: "active"
      scope: {area: "product"}
    - title: "Use customer commitments as first-class retrieval anchors"
      decision_text: "Customer commitments are retrieval anchors for revenue risk and action generation, not just CRM decoration."
      state: "active"
      scope: {area: "memory"}
    - title: "Keep DeepSeek as primary real-LLM test provider"
      decision_text: "DeepSeek remains the default real-LLM regression provider until provider-neutral test calibration is complete."
