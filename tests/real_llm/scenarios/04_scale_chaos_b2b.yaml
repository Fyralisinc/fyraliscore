signal_sequences:

  nimbus_audit_and_saml_pressure:
    description: "High-value regulated customer pressure with account aliases, incident chatter, audit export scope, and recovery."
    signals:
      - channel: "support:zendesk"
        actor: "external:nimbus.bank.cio"
        content: |
          Nimbus Bank escalation: SAML login failures hit the Risk Ops group again this morning. The CIO says the audit export is now tied to renewal approval and asked whether Fyralis can provide proof that the export covers all model revisions.
        delay_minutes: 0
        trust_tier: "authoritative_external"
        content_dict: {ticket_id: "Z-9001", severity: "sev1", customer_alias: "NBI", revenue_at_risk_usd: 2400000}

      - channel: "slack:customer-nimbus"
        actor: "Jonah Brooks"
        content: |
          Nimbus Bank is not just angry about SAML. They are connecting SAML reliability, the audit export rollout, and renewal confidence. Please treat "Finish Nimbus audit export rollout" and "Stabilize Nimbus SAML incident response" as one revenue-risk story.
        delay_minutes: 8
        thread_of: 0

      - channel: "pagerduty:incidents"
        actor: "Marcus Reed"
        content: |
          Nimbus Bank SAML incident opened as SEV1. Current hypothesis is cert rotation drift between auth-edge and legacy metadata cache. Customer-facing impact started 08:42 UTC.
        delay_minutes: 12
        trust_tier: "authoritative"
        entities_hint:
          - {type: "incident", id: "PD-NIMBUS-SAML-2026-05"}

      - channel: "github:fyralis/core"
        actor: "Luca Romano"
        content: |
          Nimbus Bank hotfix PR opened: force auth-edge to invalidate SAML metadata cache on cert rotation. This is a minimal patch for the incident; it does not solve the audit export scope question.
        delay_minutes: 34
        trust_tier: "authoritative"
        content_dict: {repo: "fyralis/core", pr: 1827, risk: "incident-hotfix"}

      - channel: "slack:eng-platform"
        actor: "Ravi Patel"
        content: |
          Good distinction from Luca: SAML recovery is today; audit export proof is the renewal blocker. Sam, can the Nimbus export include model revisions and source observations by Friday, or do we need to tell Jonah a narrower scope?
        delay_minutes: 48
        thread_of: 3

      - channel: "linear:PROD"
        actor: "Sam Ortiz"
        content: |
          Updating Finish Nimbus audit export rollout: scope now includes model revision history, triggering observations, and decision provenance. Risk is the explanation template, not export plumbing.
        delay_minutes: 95
        trust_tier: "authoritative"
        content_dict: {issue_id: "PROD-441", state: "in_progress"}

      - channel: "email:thread"
        actor: "Nia Shah"
        content: |
          Nimbus Bank audit asks are compatible with the SOC2 evidence export pack if we avoid exposing private chain-of-thought. We can show sources, model revisions, confidence, and contestations.
        delay_minutes: 210
        trust_tier: "attested_agent"

      - channel: "slack:customer-nimbus"
        actor: "Talia Morgan"
        content: |
          Support update for Nimbus Bank: SAML login failures stopped after Luca's patch. Three users still report stale sessions, but that appears client-side. I am leaving SEV1 open until their CIO confirms.
        delay_minutes: 330
        thread_of: 0

      - channel: "salesforce:renewals"
        actor: "Elena Park"
        content: |
          Nimbus Bank renewal record moved from "procurement" to "technical risk". Next executive checkpoint is Monday. Renewal owner says audit export proof matters more than price.
        delay_minutes: 420
        trust_tier: "authoritative"
        content_dict: {account: "Nimbus Bank", opportunity_stage: "technical_risk", renewal_date_days: 32}

      - channel: "slack:exec"
        actor: "Maya Chen"
        content: |
          Nimbus Bank is the right stress test for our whole premise. I want the system to connect SAML reliability, audit export proof, renewal risk, and product scope without a human stitching it manually.
        delay_minutes: 480

      - channel: "support:zendesk"
        actor: "external:nimbus.bank.cio"
        content: |
          Nimbus Bank confirms SAML recovery. The remaining renewal blocker is whether the audit export can demonstrate why a model changed and which source signals caused the revision.
        delay_minutes: 1380
        trust_tier: "authoritative_external"

      - channel: "slack:customer-nimbus"
        actor: "Sam Ortiz"
        content: |
          Nimbus Bank audit export dry run passed for model revisions and source observations. Missing piece: contested-model explanations are still too verbose for their audit team.
        delay_minutes: 1560
        thread_of: 10

  harbor_onboarding_and_clinical_scope:
    description: "Onboarding ambiguity for healthcare workflows that should connect product scope, implementation, and regulated-enterprise security."
    signals:
      - channel: "calendar:events"
        actor: "Ben Wallace"
        content: |
          Harbor Health Network kickoff: clinical ops wants daily staffing risk summaries, finance wants reimbursement exposure, and the CIO wants no patient-level data in Fyralis.
        delay_minutes: 0
        trust_tier: "authoritative"
        content_dict: {meeting: "Harbor kickoff", attendees: 9}

      - channel: "slack:customer-harbor"
        actor: "Grace Liu"
        content: |
          Harbor Health Network said "clinical workflow" but they really mean three workflows. If we model it as one onboarding commitment, retrieval will blur staffing, reimbursement, and privacy concerns.
        delay_minutes: 30

      - channel: "slack:product"
        actor: "Priya Iyer"
        content: |
          For Harbor Health Network, split the work into workflow mapping and security boundary proof. The customer cares that Fyralis remembers decisions without retaining PHI.
        delay_minutes: 75
        thread_of: 1

      - channel: "linear:IMPL"
        actor: "Ben Wallace"
        content: |
          Deliver Harbor clinical workflow mapping now has three sub-maps: staffing-risk signals, reimbursement-risk signals, and privacy-boundary assumptions. Keeping one commitment but tagging sub-domains explicitly.
        delay_minutes: 120
        trust_tier: "authoritative"

      - channel: "email:thread"
        actor: "external:harbor.health.cio"
        content: |
          Harbor Health Network will not send raw patient notes. We can send de-identified operational summaries and decisions from department leads. Please confirm your memory layer will not infer patient identities.
        delay_minutes: 260
        trust_tier: "authoritative_external"

      - channel: "slack:security"
        actor: "Nia Shah"
        content: |
          Harbor Health Network is a privacy boundary test, not just onboarding. The SOC2 evidence export pack should include a "no PHI in memory" control, or the implementation will stall.
        delay_minutes: 330

      - channel: "slack:customer-harbor"
        actor: "Ben Wallace"
        content: |
          Harbor mapping v1 is useful but incomplete. We captured staffing-risk and reimbursement-risk owners. Privacy-boundary assumptions need legal signoff before customer training.
        delay_minutes: 1440

      - channel: "email:thread"
        actor: "Victor Stein"
        content: |
          Legal review: Harbor Health Network can proceed if training materials say "operational memory" and avoid "clinical record". Do not describe Fyralis as storing patient context.
        delay_minutes: 1510
        trust_tier: "attested_agent"

      - channel: "slack:customer-harbor"
        actor: "Jonah Brooks"
        content: |
          Harbor Health Network is trending positive because we clarified scope. Risk moved from product fit to security language. Please keep the commitment anchored to onboarding time-to-value.
        delay_minutes: 1700

      - channel: "linear:IMPL"
        actor: "Ben Wallace"
        content: |
          Deliver Harbor clinical workflow mapping moved to 65 percent complete. Blocker is the privacy-language review, not customer availability.
        delay_minutes: 1830
        trust_tier: "authoritative"

  platform_latency_and_burst_load:
    description: "Systems pressure that should connect ingestion latency, webhook idempotency, customer-facing reliability, and engineering capacity."
    signals:
      - channel: "datadog:alerts"
        actor: "external:datadog"
        content: |
          Fyralis ingestion p95 exceeded 11 minutes for 34 minutes. Burst source: Salesforce renewal backfill plus Zendesk import. Tenant symptoms include Nimbus Bank and Northstar Insurance delayed risk updates.
        delay_minutes: 0
        trust_tier: "authoritative_external"
        entities_hint:
          - {type: "metric", id: "ingestion_p95_minutes"}

      - channel: "slack:eng-platform"
        actor: "Marcus Reed"
        content: |
          Ingestion latency alert is real. The queue is healthy, but embedding calls are serialized behind large Zendesk payloads. This threatens "Reduce ingestion-to-insight latency below five minutes".
        delay_minutes: 11

      - channel: "github:fyralis/core"
        actor: "Ravi Patel"
        content: |
          Opened PR to harden webhook idempotency under burst load. It adds per-source dedup partitions and keeps Salesforce replays from blocking support incidents.
        delay_minutes: 45
        trust_tier: "authoritative"
        content_dict: {repo: "fyralis/core", pr: 1834, component: "ingestion"}

      - channel: "slack:eng-platform"
        actor: "Amina Diallo"
        content: |
          Ravi's idempotency patch helps dedup, but latency is still embedding-bound. We need either bounded concurrency or a priority lane for high-revenue customer incidents.
        delay_minutes: 62
        thread_of: 2

      - channel: "slack:sre"
        actor: "Marcus Reed"
        content: |
          Priority lane sounds right, but we need a policy. Nimbus Bank SEV1 should outrank marketing imports. Northstar Insurance renewal updates should outrank old support backfill.
        delay_minutes: 91

      - channel: "slack:product"
        actor: "Priya Iyer"
        content: |
          This is exactly why customer commitments must be retrieval anchors. The system should know which events have revenue-at-risk and route Think attention accordingly.
        delay_minutes: 105

      - channel: "linear:ENG"
        actor: "Marcus Reed"
        content: |
          Cut ingestion latency p95 to five minutes is now split into: priority lane for critical customers, embedder concurrency cap, and replay-safe idempotency. Target stays this week.
        delay_minutes: 150
        trust_tier: "authoritative"

      - channel: "slack:exec"
        actor: "Omar Haddad"
        content: |
          For board narrative: do not say "latency solved." Say we discovered a scaling bottleneck under realistic customer chaos and moved critical revenue signals into the fast lane.
        delay_minutes: 240

      - channel: "datadog:alerts"
        actor: "external:datadog"
        content: |
          Ingestion p95 recovered to 4.6 minutes for priority-tagged events, but bulk backfill remains at 18 minutes. Error budget impact limited to non-critical replays.
        delay_minutes: 540
        trust_tier: "authoritative_external"

      - channel: "slack:eng-platform"
        actor: "Amina Diallo"
        content: |
          Good news: priority-tagged critical customer events are under target. Bad news: our dashboards hide the bulk-backfill pain, and bulk replays still create stale memory for lower-ARR customers.
        delay_minutes: 590

      - channel: "slack:customer-clearpath"
        actor: "Talia Morgan"
        content: |
