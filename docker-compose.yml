# =====================================================================
# docker-compose.yml — deployed production stack.
# =====================================================================
# Brings up the full ingestion data plane for a real customer on the
# four sources (gmail/github/slack/discord):
#
#   infra   : postgres, ollama, kafka (KRaft), minio (S3)
#   one-shot: migrate, kafka-init (topics), minio-init (bucket)
#   ingress : gateway (webhooks + Pub/Sub push + OAuth callbacks)
#   live    : discord_gateway_worker, telegram_gateway_worker,
#             gmail_watch_scheduler, gmail_history_poller,
#             google_calendar_live_poller, google_drive_live_poller,
#             google_calendar_watch_scheduler, google_drive_watch_scheduler
#   backfill: oauth_poller, tenant_onboarding, source_onboarding,
#             shard_fetch, reconciler, feels_onboarded_monitor
#   consume : normalizer, observation_writer, dlq_writer, embedding_worker
#   app     : think_worker, post_commit_worker, github_intel_worker
#   (UI + TLS edge live in the demo overlay repo's docker-compose.demo.yml)
#
# Secrets (per-source creds, MASTER_KEK, OAuth/HMAC keys) live in
# `.env.production` (gitignored) — see `.env.production.example`.
#
# For MANAGED Kafka/S3 (MSK, Confluent, real AWS S3): drop the kafka /
# minio / kafka-init / minio-init services and point
# KAFKA_BOOTSTRAP_SERVERS / S3_* at the managed endpoints (override the
# x-app-env values below). See docs/ingestion/production-deploy.md.

# ---- shared building blocks (YAML anchors) --------------------------
x-app-env: &app-env
  DATABASE_URL: postgresql://company_os:company_os@postgres:5432/company_os
  OLLAMA_URL: http://ollama:11434
  COMPANY_OS_ENV: prod
  FYRALIS_ENV: prod
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Default single-box object store (MinIO). For real AWS S3 set
  # S3_ENDPOINT_URL="" and real IAM creds (here or in .env.production).
  S3_ENDPOINT_URL: http://minio:9000
  S3_RAW_BUCKET: fyralis-raw
  S3_REGION_NAME: us-east-1
  AWS_ACCESS_KEY_ID: fyralis
  AWS_SECRET_ACCESS_KEY: fyralis-secret-change-me
  # Redis backs the embedding-backlog drainer's rate limiter.
  REDIS_URL: redis://redis:6379/0
  # Consumers expose /healthz + /metrics on this port (per container).
  INGESTION_HEALTH_PORT: "9300"

# Liveness probe for the Kafka consumers: /healthz is 503 if the worker
# has not made progress recently (hung loop), so a wedged consumer is
# restarted rather than silently stalling.
x-consumer-healthcheck: &consumer-healthcheck
  test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9300/healthz').status==200 else 1)\""]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

# Every long-running app/worker waits for migrations + topics + bucket.
x-app-deps: &app-deps
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  kafka-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully

x-worker: &worker
  build: .
  restart: unless-stopped
  depends_on: *app-deps
  environment: *app-env
  env_file: .env.production

services:
  # ---- infrastructure ----------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: company_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: company_os
      POSTGRES_PASSWORD: company_os
      POSTGRES_DB: company_os
    ports:
      - "5433:5432"
    volumes:
      - company_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_os -d company_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: company_os_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - company_os_ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve & sleep 3 &&
       ollama pull nomic-embed-text &&
       wait"

  kafka:
    image: apache/kafka:4.0.2
    container_name: company_os_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # In-network clients reach the broker via the service name.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Topics are provisioned explicitly by kafka-init.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - company_os_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: company_os_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fyralis
      MINIO_ROOT_PASSWORD: fyralis-secret-change-me
    volumes:
      - company_os_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: company_os_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # ---- one-shot init (run to completion, then exit) ----------------
  migrate:
    build: .
    container_name: company_os_migrate
    command: bash scripts/docker-migrate.sh
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://company_os:company_os@postgres:5432/company_os
    env_file: .env.production

  kafka-init:
    build: .
    container_name: company_os_kafka_init
    command: python scripts/provision_kafka_topics.py
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    env_file: .env.production

  minio-init:
    image: minio/mc:latest
    container_name: company_os_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fyralis fyralis-secret-change-me &&
      mc mb --ignore-existing local/fyralis-raw &&
      echo 'bucket fyralis-raw ready'"
    restart: "no"

  # ---- ingress (gateway: webhooks, Pub/Sub push, OAuth callbacks) --
  gateway:
    <<: *worker
    container_name: company_os_gateway
    environment:
      <<: *app-env
      GATEWAY_START_GRT_SCHEDULER: "1"
    expose:
      - "8000"

  # ---- backfill / onboarding workflow loops ------------------------
  oauth_poller:
    <<: *worker
    container_name: company_os_oauth_poller
    command: python -m services.ingest.ingestion.workflows.oauth_poller

  tenant_onboarding:
    <<: *worker
    container_name: company_os_tenant_onboarding
    command: python -m services.ingest.ingestion.workflows.tenant_onboarding

  source_onboarding:
    <<: *worker
    container_name: company_os_source_onboarding
    command: python -m services.ingest.ingestion.workflows.source_onboarding

  shard_fetch:
    <<: *worker
    container_name: company_os_shard_fetch
    command: python -m services.ingest.ingestion.workflows.shard_fetch

  reconciler:
    <<: *worker
    container_name: company_os_reconciler
    command: python -m services.ingest.ingestion.workflows.reconciler

  # Emits the `onboarding.progress` Kafka events Bridge consumes (LLD §6).
  # The lifecycle producers (started/complete/shard.fetched) live in the
  # backfill services above; this poller owns the two run-level signals:
  # `source.onboarding.feels_onboarded` (last 7 days queryable) and the
  # ops-only `tenant.onboarding.behind_schedule`. Global (scans all
  # tenants), so a single instance — do not scale to >1 replica.
  feels_onboarded_monitor:
    <<: *worker
    container_name: company_os_feels_onboarded_monitor
    command: python -m services.ingest.ingestion.workflows.feels_onboarded_monitor

  # Steady-state safety net: re-runs per-source gap detection for
  # already-reconciled runs on a schedule, re-sharing when a live event
  # was missed after onboarding (the one place github/slack/discord
  # have no durable live watermark). Exposes /healthz + /metrics.
  periodic_reconciler:
    <<: *worker
    container_name: company_os_periodic_reconciler
    command: python -m services.ingest.ingestion.workflows.periodic_reconciler
    healthcheck: *consumer-healthcheck

  # ---- Kafka consumer chain ----------------------------------------
  # These run ALL-SOURCES (INGESTION_SOURCE unset → each worker subscribes
  # to every per-source topic). That is the right shape for a single-box
  # dogfood. For per-source isolation (one process per source, independent
  # lag/scaling), generate and overlay the per-source topology — see
  # scripts/gen_per_source_compose.py + docs/ingestion/source-isolation.md.
  normalizer:
    <<: *worker
    container_name: company_os_normalizer
    command: python -m services.ingest.ingestion.normalizer.worker
    healthcheck: *consumer-healthcheck

  observation_writer:
    <<: *worker
    container_name: company_os_observation_writer
    command: python -m services.ingest.ingestion.writers.observation_writer
    healthcheck: *consumer-healthcheck

  dlq_writer:
    <<: *worker
    container_name: company_os_dlq_writer
    command: python -m services.ingest.ingestion.writers.dlq_writer.dlq_writer
    healthcheck: *consumer-healthcheck

  embedding_worker:
    <<: *worker
    container_name: company_os_embedding_worker
    command: python -m services.ingest.ingestion.writers.embedding_worker.embedding_worker
    healthcheck: *consumer-healthcheck

  # DB-scanning safety net: embeds observations left embedding_pending by
  # the inline live path (and any embedding request lost off the topic).
  # Rate-limited via redis. Together with embedding_worker this covers
  # every observation regardless of which ingestion path produced it.
  embedding_backlog:
    <<: *worker
    container_name: company_os_embedding_backlog
    command: python -m services.ingest.ingestion.recovery.embedding_backlog
    healthcheck: *consumer-healthcheck

  # Cutover circuit breaker: a SINGLE long-running observer that measures
  # consumer lag on every per-source raw lane (ingestion.raw.<source> vs.
  # group normalizer.<source>) and, on sustained breach, flips a tenant's
  # ingestion.kafka_path_enabled flag to FALSE — pulling that tenant back
  # to the inline path. Auto-recovery is operator-driven (see the module
  # docstring + scripts/reenable_kafka_path.py). NOT per-source: the flag is
  # per-tenant, so one instance trips each tenant on its worst lane.
  # Exposes /healthz + /metrics on INGESTION_HEALTH_PORT (9300, from app-env);
  # /healthz goes 503 if the tick loop wedges, so a hung breaker is restarted.
  circuit_breaker:
    <<: *worker
    container_name: company_os_circuit_breaker
    command: python -m services.ingest.ingestion.feature_flags
    healthcheck: *consumer-healthcheck
    # Tuning knobs (defaults shown) — override in .env.production:
    #   BREAKER_TICK_INTERVAL_SEC=60  BREAKER_THRESHOLD_SEC=60
    #   BREAKER_WINDOW_TICKS=5        BREAKER_NORMALIZER_GROUP_BASE=normalizer
    # INGESTION_ALERT_WEBHOOK_URL (if set) receives trip alerts.

  # ---- live source workers -----------------------------------------
  discord_gateway_worker:
    <<: *worker
    container_name: company_os_discord_gateway_worker
    command: python scripts/run_discord_gateway_worker.py

  telegram_gateway_worker:
    <<: *worker
    container_name: company_os_telegram_gateway_worker
    command: python scripts/run_telegram_gateway_worker.py

  signal_gateway_worker:
    <<: *worker
    container_name: company_os_signal_gateway_worker
    command: python scripts/run_signal_gateway_worker.py

  gmail_watch_scheduler:
    <<: *worker
    container_name: company_os_gmail_watch_scheduler
    command: python scripts/run_gmail_watch_scheduler.py

  gmail_history_poller:
    <<: *worker
    container_name: company_os_gmail_history_poller
    command: python scripts/run_gmail_history_poller.py

  google_calendar_live_poller:
    <<: *worker
    container_name: company_os_google_calendar_live_poller
    command: python scripts/run_google_calendar_live_poller.py

  google_drive_live_poller:
    <<: *worker
    container_name: company_os_google_drive_live_poller
    command: python scripts/run_google_drive_live_poller.py

  google_calendar_watch_scheduler:
    <<: *worker
    container_name: company_os_google_calendar_watch_scheduler
    command: python scripts/run_google_calendar_watch_scheduler.py

  google_drive_watch_scheduler:
    <<: *worker
    container_name: company_os_google_drive_watch_scheduler
    command: python scripts/run_google_drive_watch_scheduler.py

  # ---- think / post-commit application workers ---------------------
  think_worker:
    <<: *worker
    container_name: company_os_think_worker
    command: python scripts/run_think_worker.py

  post_commit_worker:
    <<: *worker
    container_name: company_os_post_commit_worker
    command: python scripts/run_post_commit_worker.py

  # GitHub Intelligence Layer — ordered FSM/state + signal-enrichment worker.
  # Sweeps github:webhook observations, advances the authoritative GitHub-state
  # FSMs, writes the github_signal_enrichment system-of-record, and emits
  # code-intel reindex triggers on default-branch advances. The inline
  # content.intelligence enrichment runs in-process on the ingest path; this
  # worker owns the ordered, authoritative state writes + the code self-update.
  github_intel_worker:
    <<: *worker
    container_name: company_os_github_intel_worker
    command: python scripts/run_github_intel_worker.py
    # NB: a service-level `environment:` REPLACES the *worker anchor's env (YAML
    # merge keys don't deep-merge mappings), so the base worker vars are
    # re-declared here alongside the github-intel additions.
    environment:
      <<: *app-env
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://company_os:company_os@postgres:5432/company_os
      PYTHONPATH: /app
      GITHUB_INTEL_POLL_SECONDS: ${GITHUB_INTEL_POLL_SECONDS:-3.0}
      GITHUB_INTEL_INLINE_TIMEOUT_MS: ${GITHUB_INTEL_INLINE_TIMEOUT_MS:-1500}
      CODE_INTEL_MAX_BLAST_HOPS: ${CODE_INTEL_MAX_BLAST_HOPS:-3}
      GITHUB_INTEL_TENANTS: ${GITHUB_INTEL_TENANTS:-${COMPANY_OS_TENANT_ID:-00000000-0000-0000-0000-000000000001}}

  # ---- retrieval/memory feature workers (ported from dev) -----------
  sage_structural_features_worker:
    <<: *worker
    container_name: company_os_sage_structural_features_worker
    command: python scripts/run_sage_structural_features_worker.py
    environment:
      <<: *app-env
      SAGE_STRUCTURAL_FEATURES_INTERVAL_S: "3600"

  sage_topology_optimizer_worker:
    <<: *worker
    container_name: company_os_sage_topology_optimizer_worker
    command: python scripts/run_sage_topology_optimizer_worker.py
    environment:
      <<: *app-env
      SAGE_TOPOLOGY_OPTIMIZER_INTERVAL_S: "60"
      SAGE_TOPOLOGY_OPTIMIZER_LOOKBACK_HOURS: "24"
      SAGE_TOPOLOGY_OPTIMIZER_LIMIT: "50"

  relationship_ontology_proposals_worker:
    <<: *worker
    container_name: company_os_relationship_ontology_proposals_worker
    command: python scripts/run_relationship_ontology_proposals_worker.py
    environment:
      <<: *app-env
      RELATIONSHIP_ONTOLOGY_PROPOSALS_INTERVAL_S: "900"
      RELATIONSHIP_ONTOLOGY_PROPOSALS_MIN_EXAMPLES: "3"
      RELATIONSHIP_ONTOLOGY_PROPOSALS_LIMIT_PER_TENANT: "500"

  # The UI + TLS edge (nginx-proxy / acme-companion) and the demo domain
  # (demo.fyralis.xyz) live in the demo overlay repo's docker-compose.demo.yml.
  # Core ships the backend gateway (exposed on :8000) + workers + data plane.

volumes:
  company_os_pgdata:
  company_os_ollama:
  company_os_kafka:
  company_os_minio:
