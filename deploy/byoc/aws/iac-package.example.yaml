schema_version: fyralis.byoc.aws.iac_package.v1
deployment_id: dep_example01
customer_id: cus_example01
environment: prod
cloud_provider: aws
region: us-east-1
artifact_revision: 2026.06.26-1
package_status: scaffold_only

references:
  dataplane_manifest_path: deploy/byoc/dataplane.example.yaml
  permissions_manifest_path: deploy/byoc/permissions.example.yaml
  iam_skeleton_path: deploy/byoc/aws/iam.bootstrap.template.yaml

execution:
  owner: customer_side_runner
  terraform_apply_allowed: false
  cloud_credentials_required_for_validation: false
  control_plane_mutating_access_allowed: false
  stores_remote_state_in_control_plane: false
  no_inbound_control_plane_ports: true

terraform:
  root_module_path: deploy/byoc/aws/terraform
  required_version: ">= 1.6.0"
  provider_source: hashicorp/aws
  provider_region_variable: region
  backend: customer_managed
  files:
    - path: deploy/byoc/aws/terraform/versions.tf
      role: provider_versions
      required: true
      declares_resources: false
    - path: deploy/byoc/aws/terraform/variables.tf
      role: input_variables
      required: true
      declares_resources: false
    - path: deploy/byoc/aws/terraform/locals.tf
      role: deployment_contract
      required: true
      declares_resources: false
    - path: deploy/byoc/aws/terraform/outputs.tf
      role: operator_outputs
      required: true
      declares_resources: false

safety:
  customer_side_bootstrap_required: true
  raw_customer_data_variables_allowed: false
  raw_secret_values_allowed: false
  outbound_control_plane_port: 443
  required_resource_tag_keys:
    - fyralis:deployment-id
    - fyralis:customer-id
    - fyralis:managed
    - fyralis:environment
  required_variables:
    - deployment_id
    - customer_id
    - environment
    - region
    - aws_account_id
    - cloudformation_stack_prefix
    - permissions_boundary_policy_arn

components:
  - name: iam
    source_contract: deploy/byoc/permissions.example.yaml
    scaffold_status: declared
  - name: network
    source_contract: deploy/byoc/dataplane.example.yaml
    scaffold_status: placeholder
  - name: data_services
    source_contract: deploy/byoc/dataplane.example.yaml
    scaffold_status: placeholder
  - name: runtime
    source_contract: deploy/byoc/bootstrap-bundle.example.yaml
    scaffold_status: placeholder
  - name: data_plane_agent
    source_contract: deploy/byoc/dataplane.example.yaml
    scaffold_status: placeholder
