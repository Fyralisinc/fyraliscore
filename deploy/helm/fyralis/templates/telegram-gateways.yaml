{{- include "fyralis.validateTelegramGateway" . -}}
{{- if .Values.telegramGateway.enabled }}
{{- $root := . }}
{{- range $installation := .Values.telegramGateway.installations }}
{{- $bindingKey := printf "%s/%s" $installation.tenantId $installation.installationId }}
{{- $bindingHash := $bindingKey | sha256sum | trunc 8 }}
{{- $componentBase := printf "telegram-gateway-%s" $installation.name | trunc 54 | trimSuffix "-" }}
{{- $component := printf "%s-%s" $componentBase $bindingHash }}
{{- $deploymentBase := printf "%s-telegram-%s" (include "fyralis.fullname" $root) $installation.name | trunc 54 | trimSuffix "-" }}
{{- $deploymentName := printf "%s-%s" $deploymentBase $bindingHash }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deploymentName }}
  labels:
    {{- include "fyralis.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    fyralis.io/source: telegram
    fyralis.io/source-installation: {{ $installation.name | quote }}
spec:
  # One exact binding per Deployment; the installation-scoped Redis lease
  # protects the authorization from duplicate failover workers.
  replicas: 1
  selector:
    matchLabels:
      {{- include "fyralis.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      annotations:
        checksum/app-env: {{ toJson $root.Values.app | sha256sum }}
        checksum/telegram-binding: {{ toJson $installation | sha256sum }}
      labels:
        {{- include "fyralis.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        fyralis.io/source: telegram
        fyralis.io/source-installation: {{ $installation.name | quote }}
    spec:
      serviceAccountName: {{ include "fyralis.serviceAccountName" $root }}
      initContainers:
        {{- include "fyralis.waitForLocalServices" $root | nindent 8 }}
      containers:
        - name: telegram-gateway
          image: {{ include "fyralis.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command:
            - python
            - scripts/run_telegram_gateway_worker.py
          ports:
            - name: health
              containerPort: {{ $root.Values.app.ingestionHealthPort }}
          envFrom:
            - configMapRef:
                name: {{ include "fyralis.appEnvConfigName" $root }}
            - secretRef:
                name: {{ include "fyralis.appSecretName" $root }}
          env:
            - name: TELEGRAM_TENANT_ID
              value: {{ $installation.tenantId | quote }}
            - name: TELEGRAM_INSTALLATION_ID
              value: {{ $installation.installationId | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml $root.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $root.Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml $root.Values.affinity | nindent 8 }}
---
{{- end }}
{{- end }}
